services:
  - type: web
    name: fcc-backend-v2
    runtime: python
    plan: starter
    region: oregon
    buildCommand: sh scripts/render/build.sh
    startCommand: mkdir -p /opt/render/project/src/data/workspace && FCC_CLAUDE_AGENT_SDK_PATH=/opt/render/project/src/node_modules/@anthropic-ai/claude-agent-sdk PATH=/opt/render/project/src/node_modules/.bin:$PATH uv run fcc-server
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: fcc-data-v2
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: HOME
        value: /opt/render/project/src/data
      - key: HOST
        value: 0.0.0.0
      - key: FCC_PLAYWRIGHT_MCP
        value: "1"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-browsers
      - key: FCC_OPEN_BROWSER
        value: "false"
      - key: FCC_ADMIN_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_AUTH_TOKEN
        sync: false
      - key: PROXY_AUTH_ENABLED
        value: "true"
      - key: NVIDIA_NIM_API_KEY
        sync: false
